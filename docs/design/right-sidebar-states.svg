<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="792" viewBox="0 0 1040 792" role="img" aria-labelledby="title desc">
  <title id="title">Githux · right sidebar, open and closed</title>
  <desc id="desc">The same six tabs, active Home page and fixed right-panel toggle in both frames. The open pane displays a tree of tabs. The closed pane occupies no space.</desc>
  <style>
    text{font-family:'Segoe UI',Arial,sans-serif;fill:#ededed;font-size:13px}.note{font-size:12px;fill:#aaa}.kicker{font-weight:600;font-size:10px;letter-spacing:1.8px;fill:#a0a0a0}.h{font-weight:600;font-size:18px}.label{font-weight:600}.muted{fill:#b5b5b5}.rule{stroke:#363636;fill:none}.i{stroke:#cecece;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;fill:none}.s{font-size:11px;fill:#bbb}
  </style>
  <defs>
    <g id="panel" class="i"><rect x="0" y="0" width="15" height="12" rx="2"/><path d="M10 1v10"/></g>
    <path id="refresh" class="i" d="M12 3a6 6 0 1 0 1 6m0-9v4H9"/>
    <g id="tree" class="i"><rect x="1" y="1" width="4" height="4" rx="1"/><rect x="10" y="6" width="4" height="4" rx="1"/><rect x="10" y="13" width="4" height="4" rx="1"/><path d="M3 5v10h7M3 8h7"/></g>
    <path id="home" class="i" d="m1 7 6-5 6 5v6H9V9H5v4H1Z"/>
    <g id="app">
      <rect width="968" height="285" rx="10" fill="#191919" stroke="#434343"/>
      <text x="16" y="23" class="label">Githux</text><rect x="628" y="7" width="217" height="21" rx="5" fill="#202020" stroke="#333"/><text x="638" y="22" class="s">Search or jump to…</text><text x="797" y="22" class="s">Ctrl+K</text><path class="i" d="M869 17h9m21-4h8v8h-8Zm30 0 8 8m0-8-8 8"/>
      <rect x="153" y="36" width="807" height="241" rx="5" fill="#202020" stroke="#333"/>
      <rect x="8" y="42" width="137" height="26" rx="5" fill="#313131"/><use xlink:href="#home" x="17" y="47"/><text x="40" y="60" class="label">Home</text><text x="18" y="87" class="muted">Settings</text><text x="17" y="124" class="s">Repositories</text><text x="18" y="148">studio / atlas</text><text x="18" y="173">team / desk</text>
      <path class="rule" d="M8 235h137"/><text x="17" y="259" class="s">My account</text>
      <rect x="161" y="42" width="75" height="24" rx="5" fill="#353535"/><use xlink:href="#home" x="170" y="46"/><text x="190" y="58" class="label">Home</text><text x="254" y="58" class="muted">studio/atlas</text><text x="354" y="58" class="muted">PR #24</text><text x="435" y="58" class="muted">README.md</text><text x="550" y="58" class="muted">team/desk</text><text x="651" y="58" class="muted">Issue #8</text><use xlink:href="#refresh" x="896" y="48"/>
      <path class="rule" d="M154 74h805"/>
    </g>
    <g id="homeContent"><text class="h" y="0">Home</text><circle cx="6" cy="38" r="5" fill="none" stroke="#65bd83"/><text x="21" y="42">Improve the reader layout</text><text x="21" y="61" class="s">#8 · team/desk</text><circle cx="6" cy="91" r="5" fill="none" stroke="#65bd83"/><text x="21" y="95">Polish keyboard navigation</text><text x="21" y="114" class="s">#24 · studio/atlas</text></g>
    <g id="feedText"><text class="h">Feed</text><text x="14" y="49">Alex starred a repository</text><text x="14" y="68" class="s">1 hour ago</text><text x="24" y="104" class="label">studio / atlas</text></g>
  </defs>
  <rect width="1040" height="792" fill="#111"/><text x="36" y="35" class="kicker">GITHUX  /  WORKSPACE NAVIGATION</text>
  <text x="36" y="66" class="h">01  Expanded</text><text x="180" y="65" class="note">Home and Feed share the remaining width</text>
  <g transform="translate(36 85)"><use xlink:href="#app"/><rect x="922" y="42" width="29" height="25" rx="5" fill="#383838"/><use xlink:href="#panel" x="929" y="48"/>
    <use xlink:href="#homeContent" x="174" y="111"/><g transform="translate(426 111)"><rect y="25" width="283" height="103" rx="6" fill="#272727" stroke="#343434"/><rect x="10" y="81" width="263" height="34" rx="5" fill="#181818"/><use xlink:href="#feedText"/></g>
    <path class="rule" d="M728 75v201"/><rect x="727" y="144" width="3" height="53" rx="1.5" fill="#777"/><use xlink:href="#tree" x="746" y="82"/><path d="M737 105h33" stroke="#ddd" stroke-width="2"/><path class="rule" d="M770 105h180"/>
    <text x="742" y="123" class="s">Open tabs</text><rect x="738" y="130" width="209" height="21" rx="4" fill="#353535"/><rect x="733" y="133" width="2" height="15" rx="1" fill="#ddd"/><use xlink:href="#home" x="745" y="133"/><text x="767" y="145" class="label">Home</text>
    <path class="rule" d="M751 171v14h12m6 8v35m0-23h10m-10 22h10"/><path class="i" d="m745 161 4 4 4-4m11 20 4 4 4-4m-27 62 4 4-4 4"/><text x="759" y="166">studio</text><text x="779" y="186">atlas</text><text x="786" y="210">PR #24</text><text x="786" y="232">README.md</text><text x="759" y="253">team</text>
  </g>
  <text x="36" y="426" class="h">02  Collapsed</text><text x="180" y="425" class="note">No rail or sash; the toggle stays in the same place</text>
  <g transform="translate(36 445)"><use xlink:href="#app"/><use xlink:href="#panel" x="929" y="48"/><use xlink:href="#homeContent" x="174" y="111"/>
    <g transform="translate(569 111)"><rect y="25" width="370" height="103" rx="6" fill="#272727" stroke="#343434"/><rect x="10" y="81" width="350" height="34" rx="5" fill="#181818"/><use xlink:href="#feedText"/></g>
  </g>
  <text x="36" y="763" class="note">Concept · sample workspace · only open tabs appear in the tree</text>
</svg>
