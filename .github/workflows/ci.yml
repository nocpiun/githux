name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  code-check:
    name: Code check (fmt, check, clippy, test)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: code-check

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bin-name: githux.exe
            artifact-name: githux-x86_64-pc-windows-msvc-debug
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin-name: githux
            artifact-name: githux-x86_64-unknown-linux-gnu-debug
          - os: macos-15
            target: aarch64-apple-darwin
            bin-name: githux
            artifact-name: githux-aarch64-apple-darwin-debug
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin-name: githux
            artifact-name: githux-x86_64-apple-darwin-debug
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            clang \
            cmake \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libssl-dev

      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target ${{ matrix.target }}
          rustup default 1.98.1

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build executable
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact-name }}
          BIN_NAME: ${{ matrix.bin-name }}
        run: |
          staging="dist/${ARTIFACT_NAME}"
          mkdir -p "${staging}"
          cp "target/${TARGET}/debug/${BIN_NAME}" "${staging}/"
          cp "assets/fonts/noto-sans/OFL.txt" "${staging}/OFL-NotoSans.txt"
          cp "assets/fonts/google-sans-code/OFL.txt" "${staging}/OFL-GoogleSansCode.txt"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "PACKAGE_PATH=${staging}" >> "$GITHUB_ENV"
          else
            chmod +x "${staging}/${BIN_NAME}"
            tar -czvf "dist/${ARTIFACT_NAME}.tar.gz" -C dist "${ARTIFACT_NAME}"
            echo "PACKAGE_PATH=dist/${ARTIFACT_NAME}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

  ci:
    name: CI
    needs: [code-check, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify upstream checks
        shell: bash
        env:
          CODE_CHECK_RESULT: ${{ needs.code-check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "code-check: ${CODE_CHECK_RESULT}"
          echo "build: ${BUILD_RESULT}"
          if [ "${CODE_CHECK_RESULT}" != "success" ] || [ "${BUILD_RESULT}" != "success" ]; then
            echo "::error::Required upstream check(s) did not succeed."
            exit 1
          fi
          echo "All required upstream checks succeeded."
