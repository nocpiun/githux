[package]
name = "githux"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "A GitHub desktop client built on the Native Shell Windows backend"

[lib]
path = "src/lib.rs"

[[bin]]
name = "githux"
path = "src/main.rs"

[dependencies]
# Native Shell v0.4.0, pinned to the release commit. The Windows platform backend is built with
# default features off so no QuickJS/JS runtime is linked for the pure-Rust application.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
unicode-segmentation = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "=0.22.1"
thiserror = "2.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
dirs = "=7.0.0"
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
# Windows Credential Manager is the only supported credential backing store.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "=3.27.0"
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
# Tests need a real multi-thread runtime to prove overlapping credential
# replacements are serialized: a current-thread runtime cannot interleave two
# tasks inside the critical section, so the test would pass even without a lock.
# The production runtime stays current-thread.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
