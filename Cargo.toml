[package]
name = "githux"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "A GitHub desktop client built with GPUI and Ely"

# Only core controls are used by the current shell. Keep macOS runtime shaders,
# but use the application's Noto Sans / Google Sans Code instead of Ely's fonts.
[dependencies]
ely-core = { default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf", features = ["runtime_shaders"] }
# Ely's settings sections and rows, on the same git revision as ely-core so there is one
# ely-core/gpui in the graph. Only the section/row layout is used; no umbrella Ely components.
ely-settings = { default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf" }
pulldown-cmark = { version = "0.13.5", default-features = false }
unicode-segmentation = "1"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "=0.22.1"
thiserror = "2.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
dirs = "=7.0.0"
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_ApplicationInstallationAndServicing", "Win32_Security_Credentials", "Foundation", "Graphics", "UI"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["x11", "wayland"] }

[dev-dependencies]
tempfile = "=3.27.0"
ely-core = { default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf", features = ["test-support"] }
# Tests need a real multi-thread runtime to prove overlapping credential
# replacements are serialized: a current-thread runtime cannot interleave two
# tasks inside the critical section, so the test would pass even without a lock.
# The production runtime stays current-thread.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
