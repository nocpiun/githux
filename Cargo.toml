[package]
name = "githux"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "A GitHub desktop client built with GPUI and Ely"

# Only core controls are used by the current shell. Keep macOS runtime shaders,
# but use the application's Noto Sans / Google Sans Code instead of Ely's fonts.
[dependencies]
ely-core = { default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf", features = ["runtime_shaders"] }
# Ely's settings sections and rows, on the same git revision as ely-core so there is one
# ely-core/gpui in the graph. Only the section/row layout is used; no umbrella Ely components.
ely-settings = { default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf" }
# Already in the graph through GPUI; declared directly so an avatar payload is fully decoded before
# it is published, instead of only being sniffed by its signature. Only the formats avatars use.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# SIMD Lanczos3 avoids scalar display-grid resampling dominating original-image first paint.
githux-image-resize = { path = "crates/image-resize" }
# Already in the graph through GPUI; used for bounded static SVG rasterization in the Markdown
# reader without adding an unmatched rasterizer version.
resvg = { version = "0.46.0", default-features = false, features = ["text", "raster-images"] }
# Use the same CSS selector and SVG value parsers as usvg for bounded declarative timelines.
simplecss = "=0.2.2"
svgtypes = "=0.16.1"
# Decode bounded embedded WOFF1 tables with the already locked inflater.
flate2 = "=1.1.10"
pulldown-cmark = { version = "0.13.5", default-features = false }
unicode-segmentation = "1"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "=0.22.1"
# Already locked through GPUI; verify raw image bodies against the requested Git object.
sha1_smol = "=1.0.1"
# Already locked through GPUI; parse HTTP Date when computing image current age.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
thiserror = "2.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
dirs = "=7.0.0"
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }

[profile.dev.package.fast_image_resize]
# SIMD convolution needs compiler optimization; keep the application/decoder
# profile unchanged and use the same resampler configuration in dev and test.
opt-level = 3

[profile.dev.package.githux-image-resize]
opt-level = 3

[profile.test.package.githux-image-resize]
opt-level = 3

[profile.test.package.fast_image_resize]
opt-level = 3

[patch.crates-io]
# 0.46.0 applies feDisplacementMap scale twice; keep one shared renderer version.
resvg = { path = "vendor/resvg" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_ApplicationInstallationAndServicing", "Win32_Security_Credentials", "Foundation", "Graphics", "UI"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["x11", "wayland"] }

[dev-dependencies]
tempfile = "=3.27.0"
ely-core = { default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "30c66fe1d5d23db769a6c834b771d054d7f288cf", features = ["test-support"] }
# Tests need a real multi-thread runtime to prove overlapping credential
# replacements are serialized: a current-thread runtime cannot interleave two
# tasks inside the critical section, so the test would pass even without a lock.
# The production runtime stays current-thread.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
