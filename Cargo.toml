[package]
name = "githux"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "A GitHub desktop client built with GPUI and Ely"

[dependencies]
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components.git", rev = "da3fdcaf39f2fa85ce1dd9cad07c3c81cf1dd721" }
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "=0.22.1"
thiserror = "2.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
dirs = "=7.0.0"
uuid = { version = "=1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-core = "=0.62.2"
windows-future = "=0.3.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_ApplicationInstallationAndServicing", "Win32_Security_Credentials", "Foundation", "Graphics", "UI"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["x11", "wayland"] }

[dev-dependencies]
tempfile = "=3.27.0"
ely-gpui-component = { git = "https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components.git", rev = "da3fdcaf39f2fa85ce1dd9cad07c3c81cf1dd721", features = ["test-support"] }
# Tests need a real multi-thread runtime to prove overlapping credential
# replacements are serialized: a current-thread runtime cannot interleave two
# tasks inside the critical section, so the test would pass even without a lock.
# The production runtime stays current-thread.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }

# The reader's inline-code and scrollbar work needs a few additions inside Ely
# that its public API does not expose. The exact upstream baseline
# (`da3fdcaf39f2fa85ce1dd9cad07c3c81cf1dd721`) is vendored under
# `vendor/ely-gpui-component` with only those additions; this patch makes both
# the normal and the dev dependency resolve to it, so a clean `--locked` build
# never reaches the network for Ely. See `docs/content-reader-markdown-patch.md`.
[patch."https://git.zacharyzhang.com/ZacharyZhang-NY/Ely-GPUI-Components.git"]
ely-gpui-component = { path = "vendor/ely-gpui-component" }
