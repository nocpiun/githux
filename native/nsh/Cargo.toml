[package]
name = "githux-nsh"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
description = "Githux Native Shell Windows migration foundation"

[lib]
path = "../../src/nsh/mod.rs"

[[bin]]
name = "githux-nsh"
path = "../../src/nsh/main.rs"

[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }

[dev-dependencies]
nsh-testing = { git = "https://github.com/longbridge/nsh", rev = "e626a8dd8f8d8b277b9507cfd5ac74d0e67020f3", default-features = false }
